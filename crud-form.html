<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <style>
        .div1 {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
        }

        #myForm {
            background-color: antiquewhite;
            border: 2px solid black;
            padding: 20px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="div1">
        <form id="myForm">
            <h2>Registration Form</h2>

            <label>Full Name:</label>
            <input type="text" id="name" required>
            <br><br>

            <label>Email:</label>
            <input type="email" id="email" required>
            <br><br>

            <label>Password:</label>
            <input type="password" id="password" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <br><br>

            <label>Skills:</label>
            <input type="checkbox" name="skills" value="HTML"> HTML
            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
            <input type="checkbox" name="skills" value="PHP"> PHP
            <br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById("myForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const gender = document.querySelector('input[name="gender"]:checked')?.value;

            const skills = Array.from(document.querySelectorAll('input[name="skills"]:checked'))
                .map(skill => skill.value);

            // Validation
            if (!gender || skills.length === 0) {
                alert("Please select gender and skills");
                return;
            }

            let users = JSON.parse(localStorage.getItem("users")) || [];

            users.push({ name, email, password, gender, skills });

            localStorage.setItem("users", JSON.stringify(users));

            window.location.href = "cruddash.html";
        });
    </script>
</body>
</html>
