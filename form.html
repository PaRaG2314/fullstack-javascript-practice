<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css"> <!--link CSS file with html-->
</head>

<body>
    <div class="newform">
        <form class="form1">
            <h1>Registration Form</h1>

            <label for="fname">First Name:</label>
            <input type="text" placeholder="Enter Your First Name" required minlength="3">
            <br><br>

            <label for="Lname">Last Name:</label>
            <input type="text" placeholder="Enter Your Last Name">
            <br><br>

            <label for="email">Email Id:</label>
            <input type="email" placeholder="Enter your Email" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="number" min="1" max="110">
            <br><br>

            <label for="contact">Contact No.:</label>
            <input type="tel" placeholder="Enter your contact number" required pattern="[0-9]{10}">
            <!--[] is for range, {} is for required digits-->
            <br><br>

            <label for="gender">Gender: </label>
            <input type="radio" name="gender" id="male" required>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" required>
            <label for="female">Female</label>
            <br><br>

            <label for="skills">SKills:</label>
            <input type="checkbox" name="skills" id="HTML">
            <label for="HTML">HTML</label>
            <input type="checkbox" name="skills" id="Python">
            <label for="Python">Python</label>
            <input type="checkbox" name="skills" id="JavaScript">
            <label for="JavaScript">JavaScript</label>
            <input type="checkbox" name="skills" id="php">
            <label for="php">PHP</label>
            <br><br>

            <label>Search Skills:</label>
            <input type="search" placeholder="Search your skills">
            <br><br>

            <label>LinkedIn:</label>
            <input type="url" placeholder="Enter URL">
            <br><br>

            <label>Experience Level:</label>
            <input type="range" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
            <output>5</output>
            <br><br>

            <label for="address">Address:</label>
            <textarea name="" id="" maxlength="250"></textarea> <!--textarea is resizable textbox-->
            <br><br>

            <label for="resume">Resume:</label>
            <input type="file" required>
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear Form">
            <br><br>
        </form>
    </div>
</body>

</html>
