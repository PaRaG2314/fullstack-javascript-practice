<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Project</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
            background-color: #f2f4f7;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            color: #2c3e50;
        }

        input {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #loginBtn {
            background-color: #3498db;
            color: white;
        }

        #loginBtn:hover {
            background-color: #2980b9;
        }

        #check {
            background-color: #2ecc71;
            color: white;
        }

        #withdrawBtn {
            background-color: #e74c3c;
            color: white;
        }

        #depositBtn {
            background-color: #27ae60;
            color: white;
        }

        #resetBtn {
            background-color: #f39c12;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        #balanceText {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        #atmSection {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>ATM Machine</h2>

        <!-- PIN SECTION -->
        <div id="pinSection">
            <p>Enter PIN</p>
            <input type="password" id="pinInput">
            <br>
            <button id="loginBtn">Enter</button>
        </div>

        <!-- ATM SECTION -->
        <div id="atmSection">
            <p id="balanceText">Balance: 10000</p>

            <button id="check">Check Balance</button>
            <button id="withdrawBtn">Withdraw</button>
            <button id="depositBtn">Deposit</button>
            <button id="resetBtn">Reset</button>
        </div>

    </div>

    <script>
        $(document).ready(function(){

            let balance = 10000;

            // PIN check
            $("#loginBtn").click(function(){
                let pin = $("#pinInput").val();

                if(pin == "1234"){
                    $("#pinSection").hide();
                    $("#atmSection").show();
                } else {
                    alert("Invalid PIN");
                }
            });

            // Check balance
            $("#check").click(function(){
                $("#balanceText").text("Balance: " + balance);
            });

            // Withdraw
            $("#withdrawBtn").click(function(){
                let amount = prompt("Enter amount:");

                if(amount == "" || amount < 0){
                    alert("Invalid amount");
                }
                else if(Number(amount) <= balance){
                    balance = balance - Number(amount);
                    $("#balanceText").text("Balance: " + balance);
                }
                else{
                    alert("Insufficient balance");
                }
            });

            // Deposit
            $("#depositBtn").click(function(){
                let amount = prompt("Enter amount:");

                if(amount == "" || amount < 0){
                    alert("Invalid amount");
                }
                else{
                    balance = balance + Number(amount);
                    $("#balanceText").text("Balance: " + balance);
                }
            });

            // Reset
            $("#resetBtn").click(function(){
                balance = 10000;
                $("#balanceText").text("Balance: " + balance);
            });

        });
    </script>

</body>

</html>
