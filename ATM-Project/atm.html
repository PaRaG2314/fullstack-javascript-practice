<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Project</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            background-color: #1e2a38;
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        .container {
            width: 360px;
            margin: auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .header {
            background-color: #34495e;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-row {
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        #loginBtn {
            background-color: #3498db;
        }

        #check {
            background-color: #2ecc71;
        }

        #withdrawBtn {
            background-color: #e74c3c;
        }

        #depositBtn {
            background-color: #27ae60;
        }

        #resetBtn {
            background-color: #f39c12;
        }

        button:hover {
            opacity: 0.85;
        }

        #balanceBox {
            background-color: #f4f6f8;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        #balanceText {
            font-size: 20px;
            color: #2c3e50;
        }

        #historyBox {
            margin-top: 15px;
            background-color: #f4f6f8;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        #atmSection {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>ATM Machine</h2>
        </div>

        <!-- PIN SECTION -->
        <div id="pinSection">
            <p>Enter PIN</p>
            <input type="password" id="pinInput">
            <br>
            <button id="loginBtn">Enter</button>
        </div>

        <!-- ATM SECTION -->
        <div id="atmSection">

            <div id="balanceBox">
                <p id="balanceText">Balance: 10000</p>
            </div>

            <div class="btn-row">
                <button id="check">Check</button>
                <button id="withdrawBtn">Withdraw</button>
            </div>

            <div class="btn-row">
                <button id="depositBtn">Deposit</button>
                <button id="resetBtn">Reset</button>
            </div>

            <!-- Transaction History -->
            <div id="historyBox">
                <p><b>Transaction History</b></p>
                <div id="history"></div>
            </div>

        </div>

    </div>

    <script>
        $(document).ready(function(){

            let balance = 10000;

            $("#loginBtn").click(function(){
                let pin = $("#pinInput").val();

                if(pin == "1234"){
                    $("#pinSection").hide();
                    $("#atmSection").show();

                    $("#history").append("Logged in <br>");
                } else {
                    alert("Invalid PIN");
                }
            });

            $("#check").click(function(){
                $("#balanceText").text("Balance: " + balance);

                $("#history").append("Checked balance: ₹" + balance + "<br>");
            });

            $("#withdrawBtn").click(function(){
                let amount = prompt("Enter amount:");

                if(amount == "" || amount < 0){
                    alert("Invalid amount");
                }
                else if(Number(amount) <= balance){
                    balance = balance - Number(amount);
                    $("#balanceText").text("Balance: " + balance);

                    $("#history").append("Withdraw: ₹" + amount + "<br>");

                    if(balance < 2000){
                        $("#balanceText").css("color", "red");
                    } else {
                        $("#balanceText").css("color", "#2c3e50");
                    }
                }
                else{
                    alert("Insufficient balance");
                }
            });

            $("#depositBtn").click(function(){
                let amount = prompt("Enter amount:");

                if(amount == "" || amount < 0){
                    alert("Invalid amount");
                }
                else{
                    balance = balance + Number(amount);
                    $("#balanceText").text("Balance: " + balance);

                    $("#history").append("Deposit: ₹" + amount + "<br>");

                    $("#balanceText").css("color", "#2c3e50");
                }
            });

            $("#resetBtn").click(function(){
                balance = 10000;
                $("#balanceText").text("Balance: " + balance);

                $("#history").append("Account Reset <br>");

                $("#balanceText").css("color", "#2c3e50");
            });

        });
    </script>

</body>

</html>
